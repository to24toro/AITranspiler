[workspace]
members = ["crates/game"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
ndarray = "0.15"
rand = "0.8"
numpy = "0.22.1"
pyo3 = { version = "0.22.6", features = ["extension-module"] }

[profile.release]
lto = "fat"
codegen-units = 1